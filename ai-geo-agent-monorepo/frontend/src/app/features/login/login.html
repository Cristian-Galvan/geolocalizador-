<div class="login-container">
  <div class="login-wrapper">
    <!-- Card -->
    <div class="login-card">
      <!-- Logo and Title -->
      <div class="login-header">
        <div class="login-logo">🌍</div>
        <h1 class="login-title">Geolizer</h1>
        <p class="login-subtitle">Explora lugares increíbles con IA</p>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage()" class="login-error">
        {{ errorMessage() }}
      </div>
      
      <!-- Login Form -->
      <div *ngIf="isLogin()" class="login-form">
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <input
            [(ngModel)]="loginUsername"
            type="text"
            placeholder="Tu usuario"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input
            [(ngModel)]="loginPassword"
            type="password"
            placeholder="Tu contraseña"
            class="form-input"
          />
        </div>

        <button
          (click)="login()"
          [disabled]="isLoading()"
          class="login-button"
        >
          <span *ngIf="!isLoading()">Iniciar Sesión</span>
          <span *ngIf="isLoading()" class="spinner"></span>
          <span *ngIf="isLoading()">Cargando...</span>
        </button>
      </div>

      <!-- Register Form -->
      <div *ngIf="!isLogin()" class="login-form">
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <input
            [(ngModel)]="registerUsername"
            type="text"
            placeholder="Elige un usuario"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input
            [(ngModel)]="registerEmail"
            type="email"
            placeholder="Tu email"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Nombre Completo (Opcional)</label>
          <input
            [(ngModel)]="registerFullName"
            type="text"
            placeholder="Tu nombre"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input
            [(ngModel)]="registerPassword"
            type="password"
            placeholder="Mínimo 6 caracteres"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Confirmar Contraseña</label>
          <input
            [(ngModel)]="registerConfirmPassword"
            type="password"
            placeholder="Repite la contraseña"
            class="form-input"
          />
        </div>

        <button
          (click)="register()"
          [disabled]="isLoading()"
          class="login-button register-button"
        >
          <span *ngIf="!isLoading()">Crear Cuenta</span>
          <span *ngIf="isLoading()" class="spinner"></span>
          <span *ngIf="isLoading()">Cargando...</span>
        </button>
      </div>

      <!-- Toggle Form -->
      <div class="toggle-form">
        <p class="toggle-text">
          <span *ngIf="isLogin()">¿No tienes cuenta? </span>
          <span *ngIf="!isLogin()">¿Ya tienes cuenta? </span>
          <button
            (click)="toggleForm()"
            class="toggle-button"
          >
            <span *ngIf="isLogin()">Registrate</span>
            <span *ngIf="!isLogin()">Inicia sesión</span>
          </button>
        </p>
      </div>
    </div>

    <!-- Footer -->
    <p class="login-footer">
      © 2026 Geolizer. Todos los derechos reservados.
    </p>
  </div>
</div>
