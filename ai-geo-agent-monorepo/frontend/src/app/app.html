<!-- Navigation Bar -->
<nav class="navbar" role="navigation" aria-label="Navegación principal">
  <div class="navbar-content">
    <div class="navbar-header">
      <!-- SVG Logo -->
      <div class="navbar-logo">
        <svg class="navbar-logo-svg" viewBox="0 0 40 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="16" r="14" fill="none" stroke="#60a5fa" stroke-width="2"/>
          <ellipse cx="20" cy="16" rx="7" ry="14" fill="none" stroke="#93c5fd" stroke-width="1.2"/>
          <line x1="6" y1="16" x2="34" y2="16" stroke="#60a5fa" stroke-width="1.2"/>
          <line x1="7" y1="10" x2="33" y2="10" stroke="#60a5fa" stroke-width="0.7" opacity="0.5"/>
          <line x1="7" y1="22" x2="33" y2="22" stroke="#60a5fa" stroke-width="0.7" opacity="0.5"/>
          <circle cx="20" cy="16" r="3" fill="#3b82f6"/>
          <line x1="20" y1="19" x2="20" y2="27" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M14 27 Q20 32 26 27" stroke="#60a5fa" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
        <h1 class="navbar-title">{{ title() }}</h1>
      </div>

      <!-- Desktop Navigation Links -->
      @if (isLoggedIn()) {
        <div class="navbar-links">
          <a routerLink="/chat" routerLinkActive="active" class="navbar-link" aria-label="Ir al chat">💬 Chat</a>
          <a routerLink="/history" routerLinkActive="active" class="navbar-link" aria-label="Ver historial">📋 Historial</a>
          <a routerLink="/ratings" routerLinkActive="active" class="navbar-link" aria-label="Ver calificaciones">⭐ Calificaciones</a>
          <div class="user-menu">
            <span class="user-name">{{ currentUser()?.username }}</span>
            <button (click)="logout()" class="logout-button" aria-label="Cerrar sesión">🚪 Salir</button>
          </div>
        </div>

        <button class="mobile-menu-button" aria-label="Menú">☰</button>
      }
    </div>

    @if (isLoggedIn()) {
      <div class="mobile-nav" role="menubar">
        <a routerLink="/chat" routerLinkActive="active" class="mobile-nav-link">💬 Chat</a>
        <a routerLink="/history" routerLinkActive="active" class="mobile-nav-link">📋 Historial</a>
        <a routerLink="/ratings" routerLinkActive="active" class="mobile-nav-link">⭐ Calificaciones</a>
        <button (click)="logout()" class="mobile-nav-link-button">🚪 Salir</button>
      </div>
    }
  </div>
</nav>

<!-- Main Content -->
<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer" role="contentinfo">
